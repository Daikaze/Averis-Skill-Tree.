name: Unpack Averis module source
on:
  push:
    paths:
      - 'packed/ready-v0.1.0.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and extract module source
        shell: bash
        run: |
          cat packed/part-00.b64 packed/part-01.b64 packed/part-02.b64 packed/part-03.b64 | base64 -d > /tmp/averis-source.tar.xz
          echo "9ce8e3fa2ac1eb9b0549cb40ecfefc1ecd9e019af9fd5b9b24c7c5d432fa3701  /tmp/averis-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/averis-source.tar.xz
          test -f module.json
          test -f scripts/main.js
          test -f scripts/data.js
      - name: Commit extracted module files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md START_HERE_BG.md module.json scripts styles templates
          if ! git diff --cached --quiet; then
            git commit -m "Add Averis Skill Tree v0.1.0 source"
            git push
          fi
