name: Unpack Averis module source
on:
  push:
    paths:
      - 'packed/averis-v0.1.0.tar.xz.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract module source
        run: |
          base64 -d packed/averis-v0.1.0.tar.xz.b64 | tar -xJf -
          test -f module.json
          test -f scripts/main.js
          test -f scripts/data.js
      - name: Commit extracted module files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md START_HERE_BG.md module.json scripts styles templates
          if ! git diff --cached --quiet; then
            git commit -m "Add Averis Skill Tree v0.1.0 source"
            git push
          fi
