name: Build and publish Averis Bound module
on:
  push:
    branches: [averis-bound-system]
    paths:
      - module.json
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/bound-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Foundry scripts and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/main.js
          node --check scripts/rules.mjs
          node --check scripts/catalog.mjs
          node --check scripts/progression.mjs
          node --test tests/*.test.mjs
      - name: Validate manifest and assemble zip
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          m=json.load(open('module.json', encoding='utf-8'))
          v=m['version']
          assert m['id']=='averis-bound-system'
          assert m['compatibility']['minimum']=='14'
          assert m['compatibility']['verified']=='14'
          assert m['relationships']['systems'][0]['id']=='dnd5e'
          assert m['relationships']['systems'][0]['compatibility']['minimum']=='5.3.3'
          assert m['manifest']=='https://raw.githubusercontent.com/Daikaze/Averis-Skill-Tree./averis-bound-system/module.json'
          assert m['download']==f'https://github.com/Daikaze/Averis-Skill-Tree./releases/download/bound-v{v}/averis-bound-system-v{v}.zip'
          assert len(v.split('.'))==3
          PY
          VERSION=$(python3 -c 'import json; print(json.load(open("module.json"))["version"])')
          echo "BOUND_VERSION=$VERSION" >> "$GITHUB_ENV"
          zip -q -r "averis-bound-system-v${VERSION}.zip" module.json scripts styles assets README.md START_HERE_BG.md
          unzip -t "averis-bound-system-v${VERSION}.zip"
      - name: Publish versioned release without replacing Skill Tree latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="bound-v${BOUND_VERSION}"
          ZIP="averis-bound-system-v${BOUND_VERSION}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Bound release $TAG already exists; update manifest version to release changes" >&2
            exit 1
          fi
          gh release create "$TAG" "$ZIP" --title "Averis Bound System v${BOUND_VERSION}" --notes "Foundry V14 / dnd5e 5.3.3. 60 progressive Bound techniques, two advancement tracks, responsive V14 interface, GM approval, regression-tested. Back up world before upgrade." --latest=false