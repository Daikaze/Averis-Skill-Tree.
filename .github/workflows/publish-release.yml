name: Publish Foundry module

on:
  push:
    branches: [main]
    paths:
      - module.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout module source
        uses: actions/checkout@v4

      - name: Install Node.js for regression tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate source and run regression tests
        run: |
          node --check scripts/main.js
          node --check scripts/data.js
          node tests/smoke.mjs

      - name: Package the Foundry VTT module
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("module.json", encoding="utf-8"))["version"])')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Invalid semantic version' >&2; exit 1
          fi
          python3 - <<'PY'
          import json
          m=json.load(open('module.json',encoding='utf-8'))
          v=m['version']
          repo='Daikaze/Averis-Skill-Tree.'
          assert m['id']=='averis-skill-tree'
          assert m['download']==f'https://github.com/{repo}/releases/download/v{v}/averis-skill-tree-v{v}.zip'
          assert m['manifest']==f'https://github.com/{repo}/releases/latest/download/module.json'
          PY
          ZIP="averis-skill-tree-v${VERSION}.zip"
          zip -q -r "$ZIP" module.json README.md START_HERE_BG.md scripts styles templates
          unzip -t "$ZIP"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite a versioned release" >&2
            exit 1
          fi
          gh release create "$TAG" "$ZIP" module.json --title "Averis Skill Tree $TAG" --notes "Initial playtest build for Foundry VTT 14 and D&D 5e 5.3.3+. Back up your world before testing." --latest
